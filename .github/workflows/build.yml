name: Build

on:
  push:
    branches: [ main, 'feat/**', 'fix/**', 'chore/**', 'docs/**' ]
  pull_request:
    branches: [ main, 'feat/**' ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]

    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-dotnet@v4.3.1
        with:
          dotnet-version: '10.x'

      - name: Build
        run: dotnet build tools/setup-cli/MultiagentSetup.csproj -c Release --nologo

      - name: Test
        run: dotnet test tools/setup-cli.Tests/MultiagentSetup.Tests/MultiagentSetup.Tests.csproj --nologo

      - name: Pack (verify templates embed)
        run: dotnet pack tools/setup-cli/MultiagentSetup.csproj -c Release --no-build --nologo -o nupkg
