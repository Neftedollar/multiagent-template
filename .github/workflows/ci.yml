name: Publish NuGet

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Build
        run: dotnet build tools/setup-cli/MultiagentSetup.csproj -c Release

      - name: Pack
        run: dotnet pack tools/setup-cli/MultiagentSetup.csproj -c Release --no-build -o nupkg

      - name: Get temporary NuGet API key (trusted publishing)
        id: nuget-auth
        uses: actions/github-script@v7
        with:
          script: |
            const oidcToken = await core.getIDToken('api.nuget.org')
            const resp = await fetch('https://api.nuget.org/v1/api-keys/provision', {
              method: 'POST',
              headers: { 'Authorization': `Bearer ${oidcToken}` }
            })
            if (!resp.ok) throw new Error(`NuGet auth failed: ${resp.status} ${await resp.text()}`)
            const { apiKey } = await resp.json()
            core.setSecret(apiKey)
            core.setOutput('api-key', apiKey)

      - name: Push to NuGet
        run: dotnet nuget push nupkg/*.nupkg --api-key ${{ steps.nuget-auth.outputs.api-key }} --source https://api.nuget.org/v3/index.json --skip-duplicate
