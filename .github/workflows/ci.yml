name: Publish NuGet

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Build
        run: dotnet build tools/setup-cli/MultiagentSetup.csproj -c Release

      - name: Pack
        run: dotnet pack tools/setup-cli/MultiagentSetup.csproj -c Release --no-build -o nupkg

      - name: Get NuGet publish token
        id: oidc
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('api.nuget.org')
            core.setSecret(token)
            core.setOutput('token', token)

      - name: Push to NuGet
        run: dotnet nuget push nupkg/*.nupkg --api-key ${{ steps.oidc.outputs.token }} --source https://api.nuget.org/v3/index.json --skip-duplicate
