name: Publish NuGet

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Build
        run: dotnet build tools/setup-cli/MultiagentSetup.csproj -c Release

      - name: Pack
        run: dotnet pack tools/setup-cli/MultiagentSetup.csproj -c Release --no-build -o nupkg

      - name: NuGet login with trusted publishing
        uses: NuGet/login@v1
        id: login
        with:
          user: Neftedollar

      - name: Push to NuGet
        run: dotnet nuget push nupkg/*.nupkg --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
