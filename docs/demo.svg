<svg xmlns="http://www.w3.org/2000/svg" width="720" height="500" viewBox="0 0 720 500">
  <defs>
    <style>
      text { font-family: 'Cascadia Code', 'Fira Code', 'SF Mono', Consolas, monospace; font-size: 13px; }
      .prompt  { fill: #58a6ff; }
      .cmd     { fill: #e6edf3; }
      .ok      { fill: #3fb950; }
      .muted   { fill: #8b949e; }
      .head    { fill: #f0883e; font-weight: bold; }
      .sec     { fill: #79c0ff; font-size: 12px; font-weight: bold; }
      .num     { fill: #d2a8ff; }
      .pname   { fill: #e6edf3; }
      .desc    { fill: #6e7681; }
      .pick    { fill: #8b949e; }
      .done    { fill: #56d364; font-weight: bold; }
      .next    { fill: #a5d6ff; }
      .dim     { fill: #6e7681; }

      .l0  { animation: fi 0.3s 0.1s  both; }
      .l1  { animation: fi 0.3s 0.5s  both; }
      .l2  { animation: fi 0.3s 0.8s  both; }
      .l3  { animation: fi 0.3s 1.0s  both; }
      .l4  { animation: fi 0.3s 1.2s  both; }
      .l5  { animation: fi 0.3s 1.4s  both; }
      .l6  { animation: fi 0.3s 1.6s  both; }
      .l7  { animation: fi 0.3s 1.8s  both; }
      .l8  { animation: fi 0.3s 2.0s  both; }
      .l9  { animation: fi 0.3s 2.2s  both; }
      .l10 { animation: fi 0.3s 2.4s  both; }
      .l11 { animation: fi 0.3s 2.8s  both; }
      .l12 { animation: fi 0.3s 3.5s  both; }
      .l13 { animation: fi 0.3s 3.8s  both; }
      .l14 { animation: fi 0.3s 4.1s  both; }
      .l15 { animation: fi 0.3s 4.4s  both; }
      .l16 { animation: fi 0.3s 4.8s  both; }
      .l17 { animation: fi 0.3s 5.2s  both; }
      .l18 { animation: fi 0.3s 5.6s  both; }

      @keyframes fi {
        from { opacity: 0; transform: translateY(2px); }
        to   { opacity: 1; transform: translateY(0); }
      }

      .cursor { animation: blink 1s step-end 0.5s infinite; fill: #58a6ff; }
      @keyframes blink { 50% { opacity: 0; } }
    </style>
  </defs>

  <!-- Terminal background -->
  <rect width="720" height="500" rx="10" fill="#0d1117"/>

  <!-- Title bar -->
  <rect width="720" height="36" rx="10" fill="#161b22"/>
  <rect width="720" height="10" y="26" fill="#161b22"/>
  <circle cx="20" cy="18" r="6" fill="#ff5f57"/>
  <circle cx="40" cy="18" r="6" fill="#febc2e"/>
  <circle cx="60" cy="18" r="6" fill="#28c840"/>
  <text x="360" y="23" text-anchor="middle" fill="#8b949e" font-size="12" font-family="sans-serif">multiagent-setup</text>

  <!-- Content -->
  <g transform="translate(20, 56)">

    <!-- $ multiagent-setup new MyApp -->
    <g class="l0">
      <text x="0"  y="0" class="prompt">~ $</text>
      <text x="28" y="0" class="cmd">multiagent-setup new MyApp</text>
    </g>

    <!-- Which AI... -->
    <g class="l1">
      <text x="0" y="18" class="head">Which AI coding assistant will you use?</text>
    </g>

    <!-- Terminal agents section -->
    <g class="l2">
      <text x="10" y="34" class="sec">Terminal agents (CLI-based):</text>
    </g>

    <!-- Rows 1-2 -->
    <g class="l3">
      <text x="18" y="50" class="num"> 1.</text><text x="45" y="50" class="pname">claude    </text><text x="150" y="50" class="desc">Claude Code by Anthropic (recommended)</text>
      <text x="18" y="66" class="num"> 2.</text><text x="45" y="66" class="pname">nessy     </text><text x="150" y="66" class="desc">Nessy CLI — Claude-compatible alias</text>
    </g>

    <!-- Rows 3-4 -->
    <g class="l4">
      <text x="18" y="82" class="num"> 3.</text><text x="45" y="82" class="pname">codex     </text><text x="150" y="82" class="desc">OpenAI Codex CLI</text>
      <text x="18" y="98" class="num"> 4.</text><text x="45" y="98" class="pname">gemini    </text><text x="150" y="98" class="desc">Google Gemini CLI</text>
    </g>

    <!-- Rows 5-6 -->
    <g class="l5">
      <text x="18" y="114" class="num"> 5.</text><text x="45" y="114" class="pname">qwen      </text><text x="150" y="114" class="desc">Qwen Code by Alibaba</text>
      <text x="18" y="130" class="num"> 6.</text><text x="45" y="130" class="pname">aider     </text><text x="150" y="130" class="desc">Aider — terminal AI pair programmer</text>
    </g>

    <!-- IDE / Extensions section -->
    <g class="l6">
      <text x="10" y="148" class="sec">IDE / Extensions:</text>
    </g>

    <!-- Rows 7-8 -->
    <g class="l7">
      <text x="18" y="164" class="num"> 7.</text><text x="45" y="164" class="pname">cursor    </text><text x="150" y="164" class="desc">Cursor IDE</text>
      <text x="18" y="180" class="num"> 8.</text><text x="45" y="180" class="pname">windsurf  </text><text x="150" y="180" class="desc">Windsurf IDE by Codeium</text>
    </g>

    <!-- Rows 9-10 -->
    <g class="l8">
      <text x="18" y="196" class="num"> 9.</text><text x="45" y="196" class="pname">copilot   </text><text x="150" y="196" class="desc">GitHub Copilot (VS Code)</text>
      <text x="18" y="212" class="num">10.</text><text x="45" y="212" class="pname">cline     </text><text x="150" y="212" class="desc">Cline — VS Code extension</text>
    </g>

    <!-- Rows 11-12 -->
    <g class="l9">
      <text x="18" y="228" class="num">11.</text><text x="45" y="228" class="pname">continue  </text><text x="150" y="228" class="desc">Continue.dev (VS Code / JetBrains)</text>
      <text x="18" y="244" class="num">12.</text><text x="45" y="244" class="pname">roo       </text><text x="150" y="244" class="desc">Roo Code — VS Code extension</text>
    </g>

    <!-- Row 13: all -->
    <g class="l10">
      <text x="18" y="260" class="num">13.</text><text x="45" y="260" class="pname">all       </text><text x="150" y="260" class="desc">scaffold all providers at once</text>
    </g>

    <!-- Pick prompt + user input -->
    <g class="l11">
      <text x="10" y="278" class="pick">Enter number or name [Enter = claude]:</text>
      <text x="298" y="278" class="cmd"> 1</text>
    </g>

    <!-- Setup output -->
    <g class="l12">
      <text x="0" y="298" class="ok">  ✓ templates extracted</text>
    </g>
    <g class="l13">
      <text x="0" y="314" class="ok">  ✓ hooks wired to .claude/settings.json</text>
    </g>
    <g class="l14">
      <text x="0" y="330" class="ok">  ✓ 24 roles → ~/.claude/commands/</text>
    </g>
    <g class="l15">
      <text x="0" y="346" class="ok">  ✓ git initialized + initial commit</text>
    </g>

    <!-- Done -->
    <g class="l16">
      <text x="0" y="368" class="done">Done! Workspace ready: ~/MyApp</text>
    </g>

    <!-- Next steps -->
    <g class="l17">
      <text x="0" y="386" class="dim">  cd MyApp &amp;&amp; claude → </text>
      <text x="146" y="386" class="next">/orchestrator</text>
      <text x="253" y="386" class="dim"> &lt;task&gt;</text>
    </g>

    <!-- New prompt -->
    <g class="l18">
      <text x="0"  y="408" class="prompt">~ $</text>
      <rect class="cursor" x="28" y="396" width="8" height="14"/>
    </g>

  </g>
</svg>
